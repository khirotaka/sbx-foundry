name: publish-base-kit

# タグ `base-kit-v<version>` を push すると、base-kit を OCI イメージとして ghcr に公開する。
# 例: git tag base-kit-v0.2.2 && git push origin base-kit-v0.2.2
on:
  push:
    tags: ["base-kit-v*"]

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/sbx-foundry-base-kit

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: タグと descriptor の version が一致するか確認
        run: |
          tag_version="${GITHUB_REF_NAME#base-kit-v}"
          file_version=$(sed -n 's/^version: *"\(.*\)"/\1/p' base-kit/base-kit.yaml | head -n 1)
          echo "tag=$tag_version descriptor=$file_version"
          [ -n "$file_version" ] && [ "$tag_version" = "$file_version" ] || {
            echo "::error::tag ($tag_version) and base-kit.yaml version ($file_version) differ"
            exit 1
          }
          echo "VERSION=$file_version" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v4
        with:
          driver: docker-container

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: build and push
        run: |
          docker buildx build base-kit -f base-kit/base-kit.yaml \
            --platform linux/amd64,linux/arm64 --provenance=mode=min --push \
            -t "$IMAGE:$VERSION" -t "$IMAGE:latest"

      - name: 公開後の manifest を確認（registry 経由で annotation が落ちていないか）
        run: docker buildx imagetools inspect "$IMAGE:$VERSION" --raw
