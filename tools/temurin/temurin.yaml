# syntax=docker/sandbox-kit:3
schemaVersion: "3"
kind: mixin
displayName: Eclipse Temurin JDK
description: Eclipse Temurin（OpenJDK）を Adoptium の公式 tarball から /opt/java に入れる。
sourceUrl: https://adoptium.net/
licenses: [GPL-2.0-with-classpath-exception]

# tools/ の kit は base-kit を前提にしない（requires を書かない）。
version: "${{ kit.args.version }}"

args:
  version:
    # Adoptium の版は 21.0.13.1+2 のような形。+ の前を version、後ろを build に分ける。
    default: "21.0.13.1"
    pattern: '^[0-9]+(\.[0-9]+){1,3}$'
    description: Temurin の版（jdk-<version>+<build> の <version>）
    buildArg: TEMURIN_VERSION
  build:
    default: "2"
    pattern: '^[0-9]+$'
    description: Temurin のビルド番号（jdk-<version>+<build> の <build>）
    buildArg: TEMURIN_BUILD
  sha256LinuxAmd64:
    default: "bb8a93f9ae6e7a693b2b721e85dbeff26ae1a77447985a8d7afcdd9c7cf6222e"
    pattern: '^[0-9a-f]{64}$'
    description: sha256 of OpenJDK<major>U-jdk_x64_linux_hotspot_<version>_<build>.tar.gz
    buildArg: TEMURIN_SHA256_AMD64
  sha256LinuxArm64:
    default: "8c72816a6b308842d5ed1f13e5826b69c567da4784f7238d7e800efa71fe54b1"
    pattern: '^[0-9a-f]{64}$'
    description: sha256 of OpenJDK<major>U-jdk_aarch64_linux_hotspot_<version>_<build>.tar.gz
    buildArg: TEMURIN_SHA256_ARM64

# java は 1 つの composition に 1 つ（JAVA_HOME がぶつかる）なので、java を provides する。
# 他の JDK kit と一緒に載せると compose 時に弾かれる。それが正しい。
provides:
  - "java@${{ kit.args.version }}"
  - "temurin@${{ kit.args.version }}"

# requires は書かない（意図的）。tarball は glibc に動的リンクされている。
# musl（Alpine など）の workload では動かないが、README に書いて済ませる。

capabilities:
  - type: com.docker.sandbox/agent-context@2
    config:
      content: |
        # Java (Eclipse Temurin)

        JDK ${{ kit.args.version }} is installed at `/opt/java/temurin` (`JAVA_HOME`),
        and `java`, `javac` and `jar` are on PATH.
